AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/bundle"
plugins:
  - rubocop-minitest

# The codebase uses double-quoted strings throughout.
Style/StringLiterals:
  EnforcedStyle: double_quotes

# Small internal library; not documenting every class/module.
Style/Documentation:
  Enabled: false

# The executable is a thin wrapper; a shebang comment is expected there.
Style/FrozenStringLiteralComment:
  Exclude:
    - "bin/**/*"

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

# `describe` blocks are expected to be long.
Metrics/BlockLength:
  Exclude:
    - "test/**/*"
